[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-intelligence"
version = "1.0.0"
description = "RetailIQ - Business & Customer Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.14.0",
    "dash-mantine-components>=2.0.0",
    "dash-iconify>=0.1.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "duckdb>=0.10.0",
    "plotly>=5.18.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W291", "W293"]

